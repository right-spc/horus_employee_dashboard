<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Horus Desk — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>

<!-- Login screen -->
<div id="login-screen" style="display:none">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">Horus Desk</div>
      <div class="login-subtitle">Internal Dashboard</div>
      <div id="login-error"></div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@horusdesk.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin()" />
      </div>
      <button class="btn btn-primary btn-lg" style="width:100%" id="login-btn" onclick="doLogin()">
        Sign In
      </button>
    </div>
  </div>
</div>

<!-- App (shown after login) -->
<div id="app-screen" style="display:none">
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-logo">
        Horus Desk
        <span>Internal Dashboard c:</span>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="orgs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Organizations
        </button>
        <button class="nav-item" data-view="demos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          Demos
        </button>
        <button class="nav-item" data-view="sales" id="sales-nav-item" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          Sales Report
        </button>
      </nav>
      <div class="sidebar-footer">
        <div id="user-display" class="text-sm text-muted" style="padding:12px 16px;border-top:1px solid var(--border)"></div>
        <button class="nav-item" onclick="doLogout()" style="color:var(--danger);opacity:0.8">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </aside>
    <main class="main" id="main">
      <div class="loading-overlay"><div class="spinner"></div> Loading...</div>
    </main>
  </div>
</div>

<div id="toast-container"></div>

<!-- Supabase Auth SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
