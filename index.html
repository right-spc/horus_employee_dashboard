<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Horus Desk — Dashboard</title>
  <meta name="theme-color" content="#020617" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>

<!-- Login screen -->
<div id="login-screen" style="display:none">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <svg class="login-mark" viewBox="0 0 200 200" fill="none" role="img" aria-label="Horus Desk logo">
          <path d="M20 100 Q100 40 180 100 Q100 160 20 100" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/>
          <circle cx="100" cy="100" r="28" stroke="currentColor" stroke-width="3" fill="none"/>
          <circle cx="100" cy="100" r="12" fill="currentColor"/>
          <path d="M30 70 Q100 30 170 70" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M25 100 L8 85 M25 100 L8 100 M25 100 L8 115" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M175 100 L192 85 M175 100 L192 100 M175 100 L192 115" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M100 128 L100 155 M82 145 L118 145" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M162 100 Q178 100 178 117 Q178 134 162 134 Q150 134 150 122" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
        <div class="login-logo">Horus Desk</div>
      </div>
      <div class="login-subtitle">Internal Dashboard</div>
      <div id="login-error"></div>
      <button
        class="btn btn-lg btn-google"
        id="login-btn"
        onclick="doGoogleLogin()"
      >
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>
      <div style="margin-top:20px;text-align:center;font-size:12px;color:var(--text-muted);opacity:0.7">Powered by <a href="https://rightspc.com" target="_blank" style="color:inherit;text-decoration:underline">Right space</a></div>
    </div>
  </div>
</div>

<!-- App (shown after login) -->
<div id="app-screen" style="display:none">
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <svg class="brand-mark" viewBox="0 0 200 200" fill="none" role="img" aria-label="Horus Desk logo">
            <path d="M20 100 Q100 40 180 100 Q100 160 20 100" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/>
            <circle cx="100" cy="100" r="28" stroke="currentColor" stroke-width="3" fill="none"/>
            <circle cx="100" cy="100" r="12" fill="currentColor"/>
            <path d="M30 70 Q100 30 170 70" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M25 100 L8 85 M25 100 L8 100 M25 100 L8 115" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M175 100 L192 85 M175 100 L192 100 M175 100 L192 115" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M100 128 L100 155 M82 145 L118 145" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M162 100 Q178 100 178 117 Q178 134 162 134 Q150 134 150 122" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          </svg>
          <div class="brand-text">Horus Desk</div>
          <button class="sidebar-expand-overlay" id="sidebar-expand" title="Expand sidebar" aria-label="Expand sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
          </button>
        </div>
        <button class="sidebar-toggle" id="sidebar-toggle" title="Collapse sidebar" aria-label="Collapse sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <button class="nav-section-header" data-section="workspace">
            <span class="nav-section-label">Workspace</span>
            <span class="nav-section-line"></span>
            <svg class="nav-section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="nav-section-items">
            <button class="nav-item active" data-view="orgs" data-label="Organizations">
              <span class="nav-active-bar"></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              <span class="nav-label">Organizations</span>
            </button>
            <button class="nav-item" data-view="demos" data-label="Demos">
              <span class="nav-active-bar"></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
              <span class="nav-label">Demos</span>
            </button>
          </div>
        </div>
        <div class="nav-section" id="section-manage" style="display:none">
          <button class="nav-section-header" data-section="manage">
            <span class="nav-section-label">Management</span>
            <span class="nav-section-line"></span>
            <svg class="nav-section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="nav-section-items">
            <button class="nav-item" data-view="sales" id="sales-nav-item" data-label="Sales Report" style="display:none">
              <span class="nav-active-bar"></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
              <span class="nav-label">Sales Report</span>
            </button>
            <button class="nav-item" data-view="team" id="team-nav-item" data-label="Team" style="display:none">
              <span class="nav-active-bar"></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
              <span class="nav-label">Team</span>
            </button>
          </div>
        </div>
      </nav>
      <div class="sidebar-user">
        <div class="user-menu" id="user-menu" style="display:none">
          <button class="user-menu-item danger" onclick="doLogout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign Out
          </button>
        </div>
        <button class="user-card" id="user-card">
          <span class="user-avatar"><span id="user-initial">&middot;</span><span class="user-status-dot"></span></span>
          <span class="user-meta">
            <span class="user-name" id="user-name"></span>
            <span class="user-role" id="user-role"></span>
          </span>
          <svg class="user-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
        </button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <button class="sidebar-fab" id="sidebar-fab" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <main class="main" id="main">
      <div class="loading-overlay"><div class="spinner"></div> Loading...</div>
    </main>
    <div class="version-footer" style="position:fixed;bottom:8px;right:12px;font-size:12px;color:var(--text-muted);opacity:0.7">V1.2.0</div>
  </div>
</div>

<div id="toast-container"></div>

<!-- Supabase Auth SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
